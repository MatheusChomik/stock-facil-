<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Login</title>
  <link rel="stylesheet" href="../assets/login.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="login-card">
      <h2>Acessar o Sistema</h2>
      <p>Controle de Estoque para Empresas</p>

      <div class="login-error" id="loginError">Usuário ou senha incorretos.</div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="voce@email.com" required autocomplete="username">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">

        <button type="submit">Acessar Sistema</button>
      </form>

      <p class="esqueceu">Esqueceu a senha?</p>

      <div style="margin-top:18px;background:#0a2433;border:1px solid #0d2d40;border-radius:8px;padding:12px 14px;font-size:12px;color:#9fc1d2;line-height:1.7;">
        <strong style="color:#00d4b0;display:block;margin-bottom:4px;">🔑 Credenciais de demonstração</strong>
        Admin: <code style="color:#fff">admin@stock.com</code> / <code style="color:#fff">admin123</code><br>
        Operador: <code style="color:#fff">operador@stock.com</code> / <code style="color:#fff">op123</code>
      </div>
    </div>
  </div>

  <script src="../assets/db.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
