<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Registro de Vendas</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="sidebar-role">Painel do Administrador</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <span class="nav-section">Gestão de Estoque</span>
      <a href="cadastrodeprodutos.html">Cadastro de Produtos</a>
      <a href="listadeprodutos.html">Lista de Produtos</a>
      <a href="entradadeestoque.html">Entrada de Estoque</a>
      <span class="nav-section">Operações e Relatórios</span>
      <a href="registrodevendas.html" class="ativo">Registro de Vendas</a>
      <a href="painelderelatorio.html">Painel de Relatório</a>
      <a href="alertasdeestoque.html">Alertas de Estoque</a>
      <span class="nav-section">Configurações</span>
      <a href="gestaodeusuarios.html">Gestão de Usuários</a>
    </nav>
    <div class="sidebar-footer">
      <a href="login.html">Sair</a>
    </div>
  </aside>

  <main class="conteudo">
    <h1>Registro de Vendas</h1>

    <input class="barra-pesquisa" type="text" id="busca" placeholder="Buscar por produto..." oninput="filtrar()">

    <div class="tabela-card">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd. Vendida</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>

    <p style="margin-top:16px; font-size:14px; color:#6b7280;">
      Total geral: <strong id="total" style="color:#1a1f2e;">R$0,00</strong>
    </p>
  </main>

  <script>
    const vendas = [
      { item: 'Arroz Tio Urbano 5kg', qtd: 58, preco: 5.52 },
      { item: 'Feijão Carioca 1kg',   qtd: 42, preco: 8.00 },
    ];

    function fmt(v) {
      return 'R$ ' + v.toFixed(2).replace('.', ',');
    }

    function renderizar(filtro = '') {
      const tbody = document.getElementById('tabela');
      const lista  = vendas.filter(v => v.item.toLowerCase().includes(filtro.toLowerCase()));

      tbody.innerHTML = lista.map(v => `
        <tr>
          <td>${v.item}</td>
          <td>${v.qtd}</td>
          <td>${fmt(v.qtd * v.preco)}</td>
        </tr>
      `).join('');

      document.getElementById('total').textContent = fmt(
        vendas.reduce((s, v) => s + v.qtd * v.preco, 0)
      );
    }

    function filtrar() {
      renderizar(document.getElementById('busca').value);
    }

    renderizar();
  </script>

</body>
</html>
