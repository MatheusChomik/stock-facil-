<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Gestão de Usuários</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="sidebar-role">Painel do Administrador</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <span class="nav-section">Gestão de Estoque</span>
      <a href="cadastrodeprodutos.html">Cadastro de Produtos</a>
      <a href="listadeprodutos.html">Lista de Produtos</a>
      <a href="entradadeestoque.html">Entrada de Estoque</a>
      <span class="nav-section">Operações e Relatórios</span>
      <a href="registrodevendas.html">Registro de Vendas</a>
      <a href="painelderelatorio.html">Painel de Relatório</a>
      <a href="alertasdeestoque.html">Alertas de Estoque</a>
      <span class="nav-section">Configurações</span>
      <a href="gestaodeusuarios.html" class="ativo">Gestão de Usuários</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="btnSair">Sair</a>
    </div>
  </aside>

  <main class="conteudo">
    <h1>Gestão de Usuários</h1>

    <div style="margin-bottom: 16px;">
      <button class="btn btn-primary" id="btnNovoUsuario">+ Novo Usuário</button>
    </div>

    <div class="tabela-card">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Papel</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbodyUsuarios"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal novo usuário -->
  <div class="modal-overlay" id="modalUsuario">
    <div class="modal">
      <h2 style="font-size:16px; font-weight:700; margin-bottom:20px;">Novo Usuário</h2>
      <form id="formUsuario">
        <div class="form-box" style="padding:0;border:none;background:transparent;max-width:100%;margin-bottom:14px;">
          <label>Nome</label>
          <input type="text" id="uNome" required placeholder="Nome completo">
        </div>
        <div class="form-box" style="padding:0;border:none;background:transparent;max-width:100%;margin-bottom:14px;">
          <label>E-mail</label>
          <input type="email" id="uEmail" required placeholder="email@exemplo.com">
        </div>
        <div class="form-box" style="padding:0;border:none;background:transparent;max-width:100%;margin-bottom:14px;">
          <label>Senha</label>
          <input type="password" id="uSenha" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-box" style="padding:0;border:none;background:transparent;max-width:100%;margin-bottom:20px;">
          <label>Papel</label>
          <select id="uPapel">
            <option value="operador">Operador</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="modal-acoes">
          <button type="button" class="btn btn-secondary" id="btnCancelarUsuario">Cancelar</button>
          <button type="submit" class="btn btn-primary">Criar Usuário</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/db.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="gestaodeusuarios.js"></script>

</body>
</html>
