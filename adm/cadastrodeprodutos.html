<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Cadastro de Produtos</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="sidebar-role">Painel do Administrador</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <span class="nav-section">Gestão de Estoque</span>
      <a href="cadastrodeprodutos.html" class="ativo">Cadastro de Produtos</a>
      <a href="listadeprodutos.html">Lista de Produtos</a>
      <a href="entradadeestoque.html">Entrada de Estoque</a>
      <span class="nav-section">Operações e Relatórios</span>
      <a href="registrodevendas.html">Registro de Vendas</a>
      <a href="painelderelatorio.html">Painel de Relatório</a>
      <a href="alertasdeestoque.html">Alertas de Estoque</a>
      <span class="nav-section">Configurações</span>
      <a href="gestaodeusuarios.html">Gestão de Usuários</a>
    </nav>
    <div class="sidebar-footer">
      <a href="login.html" id="btnSair">Sair</a>
    </div>
  </aside>

  <main class="conteudo">
    <h1>Cadastro de Produto</h1>

    <div class="form-box">
      <div id="msg" class="msg" style="display:none"></div>
      <form id="formProduto">
        <label for="nome">Nome do Produto</label>
        <input type="text" id="nome" placeholder="Ex: Arroz Tio Urbano 5kg" required>

        <div class="linha-form">
          <div>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" placeholder="0" min="0" value="0">
          </div>
          <div>
            <label for="estoqueMinimo">Estoque Mínimo</label>
            <input type="number" id="estoqueMinimo" placeholder="0" min="0" value="0">
          </div>
        </div>

        <div class="linha-form">
          <div>
            <label for="precoCusto">Preço de Custo (R$)</label>
            <input type="text" id="precoCusto" placeholder="0,00">
          </div>
          <div>
            <label for="precoVenda">Preço de Venda (R$)</label>
            <input type="text" id="precoVenda" placeholder="0,00">
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar Produto</button>
      </form>
    </div>
  </main>

  <script src="../assets/db.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="cadastrodeprodutos.js"></script>
</body>
</html>
