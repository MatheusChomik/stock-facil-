<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Painel do Operador</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="sidebar-role">Painel do Operador</div>
    <nav class="sidebar-nav">
      <a href="painel.html" class="ativo">Painel</a>
      <a href="atualizar.html">Atualizar Pedidos</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="envio-entrega.html">Envio e Entrega</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="btnSair">Sair</a>
    </div>
  </aside>

  <main class="conteudo">
    <h1>Painel do Operador</h1>

    <div class="status-pedidos">
      <div class="status-card pendentes">
        <div class="status-label">Pedidos Pendentes</div>
        <div class="status-valor" id="cntPendente">—</div>
      </div>
      <div class="status-card separacao">
        <div class="status-label">Em Separação</div>
        <div class="status-valor" id="cntSeparacao">—</div>
      </div>
      <div class="status-card enviados">
        <div class="status-label">Em Rota</div>
        <div class="status-valor" id="cntRota">—</div>
      </div>
      <div class="status-card atrasadas">
        <div class="status-label">Entregues</div>
        <div class="status-valor" id="cntEntregue">—</div>
      </div>
    </div>

    <div class="tabela-card">
      <div class="tabela-card-cabecalho">Pedidos em Aberto</div>
      <table>
        <thead>
          <tr>
            <th>Nº Pedido</th>
            <th>Cliente</th>
            <th>Itens</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tbodyPedidos"></tbody>
      </table>
    </div>
  </main>

  <script src="../assets/db.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="painel.js"></script>

</body>
</html>
