<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Atualizar Pedidos</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .pedido-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .pedido-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .pedido-header h3 { font-size: 14px; font-weight: 600; }
    .pedido-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; border-top: 1px solid var(--border); }
    .pedido-form > div:last-child { grid-column: 1 / -1; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="sidebar-role">Painel do Operador</div>
    <nav class="sidebar-nav">
      <a href="painel.html">Painel</a>
      <a href="atualizar.html" class="ativo">Atualizar Pedidos</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="envio-entrega.html">Envio e Entrega</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="btnSair">Sair</a>
    </div>
  </aside>

  <main class="conteudo">
    <h1>Atualizar Pedidos</h1>

    <input class="barra-pesquisa" type="text" id="busca" placeholder="Buscar pedido por cliente...">

    <div id="listaPedidos"></div>
  </main>

  <script src="../assets/db.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="atualizar.js"></script>

</body>
</html>
