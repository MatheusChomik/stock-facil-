<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Fácil — Movimentações</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Stock Fácil">
    </div>
    <div class="sidebar-role">Painel do Operador</div>
    <nav class="sidebar-nav">
      <a href="painel.html">Painel</a>
      <a href="atualizar.html">Atualizar Pedidos</a>
      <a href="movimentacoes.html" class="ativo">Movimentações</a>
      <a href="envio-entrega.html">Envio e Entrega</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="btnSair">Sair</a>
    </div>
  </aside>

  <main class="conteudo">
    <h1>Movimentações</h1>
    <p style="color:var(--text-muted); margin-top:-18px; margin-bottom:24px; font-size:13px;">Entradas e saídas do estoque</p>

    <div style="display:flex; gap:12px; margin-bottom:20px;">
      <button class="btn btn-primary" id="btnEntrada">+ Nova Entrada</button>
      <button class="btn btn-secondary" id="btnSaida">+ Registrar Saída</button>
    </div>

    <div class="tabela-card">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Produto</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Responsável</th>
          </tr>
        </thead>
        <tbody id="tbodyMovs"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal movimentação -->
  <div class="modal-overlay" id="modalMov">
    <div class="modal">
      <h2 style="font-size:16px; font-weight:700; margin-bottom:20px;" id="modalMovTitulo">Nova Movimentação</h2>
      <form id="formMov">
        <input type="hidden" id="movTipo" value="entrada">
        <div class="form-box" style="padding:0;border:none;background:transparent;max-width:100%;margin-bottom:14px;">
          <label>Produto</label>
          <select id="movProduto" required></select>
        </div>
        <div class="form-box" style="padding:0;border:none;background:transparent;max-width:100%;margin-bottom:20px;">
          <label>Quantidade</label>
          <input type="number" id="movQtd" min="1" required placeholder="Ex: 50">
        </div>
        <div class="modal-acoes">
          <button type="button" class="btn btn-secondary" id="btnCancelarMov">Cancelar</button>
          <button type="submit" class="btn btn-primary">Confirmar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/db.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="movimentacoes.js"></script>

</body>
</html>
